<script>
/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+n); return iso(dt); };
const diffDays = (t, b = iso()) => { const [ty,tm,td] = t.split('-').map(Number), [by,bm,bd] = b.split('-').map(Number); return Math.round((Date.UTC(ty,tm-1,td)-Date.UTC(by,bm-1,bd))/864e5); };
const validISO = (v) => { if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false; const [y,m,d] = v.split('-').map(Number); const dt = new Date(y,m-1,d); return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const clone = (o) => JSON.parse(JSON.stringify(o));
const TYPE_KEYS = ['subscription_trial','return_window','bill','official_letter','renewal','other'];
const TYPES = Object.fromEntries(TYPE_KEYS.map(k => [k, k]));
const ICONS = { subscription_trial:'🔁', return_window:'📦', bill:'🧾', official_letter:'✉️', renewal:'🪪', other:'📌' };

/* ---------- finishing helpers: IBAN check, safe links ---------- */
function ibanMod97(raw) {
  const s = String(raw || '').replace(/\s+/g, '').toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r = s.slice(4) + s.slice(0, 4); let rem = 0;
  for (const ch of r) { const v = ch >= 'A' ? String(ch.charCodeAt(0) - 55) : ch; for (const dg of v) rem = (rem * 10 + Number(dg)) % 97; }
  return rem === 1;
}
const ibanGroup = (raw) => String(raw || '').replace(/\s+/g, '').toUpperCase().replace(/(.{4})/g, '$1 ').trim();
const cleanText = (v, max) => { const s = String(v ?? '').trim().slice(0, max); return s || null; };
const cleanIbanField = (v) => { const s = String(v ?? '').replace(/\s+/g, '').toUpperCase().slice(0, 40); return s ? ibanGroup(s) : null; };
const cleanUrl = (v) => { try { const u = new URL(String(v ?? '').trim()); return (u.protocol === 'https:' && u.hostname.includes('.') && !u.username && !u.password) ? u.href.slice(0, 500) : null; } catch { return null; } };
const urlHost = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };

/* ---------- storage ---------- */
const K = { items:'nudge.html.items', key:'nudge.html.key', model:'nudge.html.model', asked:'nudge.html.notifAsked', lang:'nudge.html.lang', last:'nudge.html.lastOpen' };
const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const loadItems = () => { try { const a = JSON.parse(get(K.items, '[]')); return Array.isArray(a) ? a : []; } catch { return []; } };

/* ---------- texts (Turkish default, English switchable) ---------- */
const T = {
tr: {
  tag:'Sakin bir dış hafıza. Tek seferde tek şey.', add:'+ Ekle', settings:'Ayarlar', next:'Sıradaki', more:'+ {n} daha göster', less:'Sadece ilk 3’ü göster',
  details:'Detaylar', pdfBig:'Bu PDF çok büyük (3,5 MB üstü). Daha küçük bir PDF ya da fotoğraf dene.', signSkip:'Şimdilik giriş yapmadan elle ekle', empty:'Bekleyen bir şey yok. Sessizliğin tadını çıkar.', close:'Kapat', done:'Bitti', snooze:'Ertele', details:'Detaylar', undo:'Geri al', back:'Geri', cancel:'Vazgeç',

const LANGS = ['tr', 'en', 'de'];
const normLang = (v) => LANGS.includes(v) ? v : 'tr';
let LANG = normLang(get(K.lang, ''));
const t = (k, v) => { let s = T[LANG][k]; if (s === undefined) return k; if (v) for (const [a, b] of Object.entries(v)) s = s.split(`{${a}}`).join(b); return s; };
const loc = () => ({ tr: 'tr-TR', en: 'en', de: 'de-DE' })[LANG];
const fmtDate = (v) => { if (!validISO(v)) return ''; const [y,m,d] = v.split('-').map(Number); return new Intl.DateTimeFormat(loc(),{month:'short',day:'numeric',year:'numeric'}).format(new Date(y,m-1,d)); };
const money = (a, c) => { if (a === null || a === undefined || isNaN(a)) return null; const code = (c || 'EUR').toUpperCase(); try { return new Intl.NumberFormat(loc(),{style:'currency',currency:code}).format(a); } catch { return `${Number(a).toFixed(2)} ${code}`; } };
/* urgency = colour + icon + words, never colour alone */
function urgency(dl) {
  if (!validISO(dl)) return { cls: 'later', icon: '🌿', label: t('noDate') };
  const n = diffDays(dl);
  if (n < 0) return { cls: 'urgent', icon: '🕰️', label: t('passed') };
  if (n === 0) return { cls: 'urgent', icon: '⏳', label: t('today') };
  if (n === 1) return { cls: 'urgent', icon: '⏳', label: t('tomorrow') };
  if (n <= 7) return { cls: '', icon: '📅', label: t('inDays', { n }) };
  return { cls: 'later', icon: '🌿', label: t('inDays', { n }) };
}
