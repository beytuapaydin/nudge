<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nudge — Confirm action</title>
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: #FAF8F5;
        color: #292524;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 440px;
        margin: 40px auto;
        background: #ffffff;
        border: 1px solid #E6DFD5;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #2F6F62;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        color: #1c1917;
      }
      p {
        margin: 0 0 22px;
        line-height: 1.5;
        color: #57534e;
      }
      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 14px;
        background: #2F6F62;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        padding: 12px 20px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Nudge</p>
      <h1 id="heading">Loading item…</h1>
      <p id="details"></p>
      <button id="confirm-btn" type="button" hidden></button>
    </main>

    <script>
      const FUNCTION_URL = 'https://YOUR_PROJECT_REF.supabase.co/functions/v1/handle-reminder-action';
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      const action = params.get('action') || '';
      const exp = params.get('exp') || '';
      const sig = params.get('sig') || '';

      const headingEl = document.getElementById('heading');
      const detailsEl = document.getElementById('details');
      const btn = document.getElementById('confirm-btn');

      async function loadPreview() {
        if (!id || !action || !exp || !sig) {
          headingEl.textContent = 'Invalid link';
          detailsEl.textContent = 'Open Nudge in your browser to update this item.';
          return;
        }

        try {
          const res = await fetch(`${FUNCTION_URL}?${params.toString()}`, {
            headers: { Accept: 'application/json' },
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Link expired or invalid.');

          headingEl.textContent = data.title;
          detailsEl.textContent = data.next_action;
          btn.textContent = action === 'done' ? 'Confirm: Mark done' : 'Confirm: Snooze 1 day';
          btn.hidden = false;
        } catch (err) {
          headingEl.textContent = 'Link expired or invalid';
          detailsEl.textContent = err.message || 'Open Nudge in your browser.';
        }
      }

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Saving…';

        try {
          const res = await fetch(FUNCTION_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({ id, action, exp, sig }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not update item.');

          btn.hidden = true;
          if (data.action === 'done') {
            headingEl.textContent = 'Marked done';
            detailsEl.textContent = `${data.title} is handled. You can close this tab.`;
          } else {
            headingEl.textContent = 'Snoozed for 1 day';
            detailsEl.textContent = `${data.title} will wait until ${data.snoozed_until}. You can close this tab.`;
          }
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Try again';
          detailsEl.textContent = err.message;
        }
      });

      loadPreview();
    </script>
  </body>
</html>
